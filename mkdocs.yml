  # Screenshots open full size on click — an interface capture is unreadable
  # at page width.
  - glightbox:
      touchNavigation: true
      effect: fade
      zoomable: true
      draggable: false
  # Shows when each page was last updated, from the git history.
  # Must stay AFTER the i18n plugin, which provides the `locale` variable.
  # Needs the full git history at build time — never build from a shallow clone.
  - git-revision-date-localized:
      type: date
      timezone: Europe/Paris
      enable_creation_date: false
      fallback_to_build_date: true

nav:
  # ── Le menu de la doc EST le menu du produit ─────────────────────────────────
  # Les groupes portent les mots exacts de la barre latérale de l'application
  # (NavigationCatalogue côté serveur) : un utilisateur retrouve ici, au même endroit,
  # ce qu'il voit dans l'outil. Les pages, elles, gardent un titre français.
  - Accueil: index.md
  - Une mobilité de bout en bout: parcours-complet.md
  - Espace établissement:
      - Management:
          - Tableau de bord: etablissement/dashboards.md
          - Validations: etablissement/validations.md
      - Mobility:
          - Agenda: etablissement/agenda.md
          - Institutions:
              - Partenaires: etablissement/partenaires.md
              - Accords &amp; places: etablissement/accords.md
          - Atlas: atlas/atlas.md
          - Outgoing:
              - Étudiants sortants: etablissement/etudiants.md
              - Campagnes: etablissement/campagnes.md
          - Incoming:
              - Étudiants entrants: etablissement/etudiants-entrants.md
              - Onboarding: etablissement/onboarding.md
          - Le dossier d'un étudiant: etablissement/fiche-etudiant.md
          - Workflows:
              - Parcours de mobilité: etablissement/parcours.md
              - Suivi des mobilités: etablissement/suivi-mobilites.md
      - Institution:
          - Mon établissement: etablissement/mon-etablissement.md
          - Votre fiche publique: etablissement/fiche-publique.md
          - Bourse &amp; paiements: etablissement/bourse.md
      - Communication:
          - Diffusion &amp; messages: etablissement/communications.md
      - Settings:
          - Paramètres &amp; équipe: etablissement/parametres.md
          - Documents &amp; modèles: etablissement/documents.md
          - Emails &amp; connecteurs: etablissement/emails.md
  - Espace étudiant:
      - My exchange:
          - Découverte &amp; candidature: etudiant/decouverte-candidature.md
          - Pendant &amp; après la mobilité: etudiant/pendant-apres-mobilite.md
  - Réseau EWP:
      - Vue d'ensemble: ewp/ewp.md
      - Référence des API (DSI): ewp/reference-api.md
  - Plateforme &amp; sécurité:
      - Vue d'ensemble: plateforme/plateforme.md
      - Authentification unique (DSI):
          - Vue d'ensemble: plateforme/sso.md
          - Microsoft Entra ID: plateforme/sso-microsoft.md
      - Architecture &amp; technologies: plateforme/architecture.md
      - Sécurité &amp; données: plateforme/securite.md
  - Annexes:
      - Quand quelque chose ne passe pas: blocages.md
      - Glossaire: annexes/glossaire.md
