site_name: AroundLink — Documentation produit
site_description: Le recensement des fonctionnalités d'AroundLink et de leur valeur métier.
site_author: AroundLink
copyright: >
  © AroundLink —
  <a href="https://aroundlink.com">aroundlink.com</a> ·
  <a href="https://app.aroundlink.com">Accéder à l'application</a> ·
  <a href="https://cal.com/simon-petit-aroundlink/30minds">Prendre rendez-vous</a>

# ⚠️  Publié via GitHub Pages. Ne jamais mettre de secrets ici ni dans les pages.
# site_url est renseigné automatiquement par `mkdocs gh-deploy`.

theme:
  name: material
  language: fr
  logo: assets/logo.png
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github
  font:
    text: Plus Jakarta Sans
    code: JetBrains Mono
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - search.share
    - content.tooltips
  # Une seule palette, sans bascule : la place qu'occupait le thème sombre
  # sert maintenant au bouton de prise de rendez-vous (voir rendez-vous.js).
  palette:
    scheme: default
    primary: custom
    accent: custom

extra:
  social:
    - icon: fontawesome/solid/globe
      link: https://aroundlink.com
      name: Site AroundLink
    - icon: fontawesome/solid/arrow-right-to-bracket
      link: https://app.aroundlink.com
      name: Accéder à l'application

extra_css:
  - assets/extra.css

extra_javascript:
  - assets/rendez-vous.js

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search:
      lang:
        - fr
        - en
        - es
        - it
        - de
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: fr
          default: true
          name: Français
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            Accueil: Home
            Espace établissement: Institution workspace
            Espace étudiant: Student portal
            Atlas — Annuaire mondial: Atlas — World directory
            Réseau EWP: EWP network
            Vue d'ensemble: Overview
            Référence des API (DSI): API reference (IT)
